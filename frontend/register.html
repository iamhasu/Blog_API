<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account - MyBlog</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="site-shell">
<header class="nav"><a class="brand" href="index.html">MyBlog</a><nav class="nav-links">
<a href="index.html">Home</a><a href="my-posts.html">My Posts</a><a href="login.html">Login</a><a class="nav-btn" href="register.html">Register</a><button class="nav-btn logout-btn" type="button">Logout</button>
</nav></header>
<main class="page">
<form id="register-form" class="form-wrap">
<h1>Create Account</h1><p class="form-sub">Join our community today</p>
<div id="message" class="message" hidden></div>
<div class="field"><label>Email</label><input class="input" type="email" name="email" placeholder="Enter your email" required></div>
<div class="field"><label>Password</label><input class="input" type="password" name="password" placeholder="Enter your password" required></div>
<div class="field"><label>Confirm Password</label><input class="input" type="password" name="confirm" placeholder="Confirm your password" required></div>
<button class="btn form-submit" type="submit">Register</button>
<p class="form-note">Already have an account? <a href="login.html">Login</a></p>
</form>
</main><footer class="footer">© 2026 MyBlog. All rights reserved.</footer></div>
<script src="app.js"></script></body></html>
